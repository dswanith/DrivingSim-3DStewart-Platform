<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stewart Platform 6-DOF Kinematics Simulator</title>
    <meta name="description" content="Interactive 3D Stewart platform inverse kinematics simulator with six actuators, real-time visualization, and manual control.">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- 3D Viewport -->
        <div id="viewport">
            <div class="title-bar">
                <h1>Stewart Platform Simulator</h1>
                <div class="subtitle">6-DOF Inverse Kinematics · Interactive 3D</div>
            </div>
        </div>

        <!-- Control Panel -->
        <div id="control-panel">
            <div class="panel-header">
                <h2>Platform Controls</h2>
            </div>

            <!-- Mode Toggle -->
            <div class="panel-section" id="mode-toggle-section">
                <h3>Control Mode</h3>
            </div>

            <!-- Pose Sliders -->
            <div class="panel-section" id="pose-controls-section">
                <h3>Pose Control</h3>
                <div id="pose-controls"></div>
            </div>

            <!-- Actuator Sliders -->
            <div class="panel-section" id="actuator-controls-section">
                <h3>Actuator Control</h3>
                <div id="actuator-controls"></div>
            </div>

            <!-- Presets -->
            <div class="panel-section" id="presets-section">
                <h3>Presets</h3>
            </div>

            <!-- Readouts -->
            <div class="panel-section" id="readouts-section">
                <h3>Status</h3>
            </div>

            <!-- Actuator Limits -->
            <div class="panel-section" id="limits-section">
                <h3>Actuator Limits</h3>
            </div>
        </div>
    </div>

    <!-- Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Application modules (order matters) -->
    <script src="kinematics.js"></script>
    <script src="renderer.js"></script>
    <script src="ui.js"></script>
    <script src="main.js"></script>
</body>
</html>
